name: Google Dev Kit

on:
  pull_request:
    paths:
      - "plugins/google-dev-kit/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/google-dev-kit.yml"
  push:
    branches: [main]
    paths:
      - "plugins/google-dev-kit/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/google-dev-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r plugins/google-dev-kit/requirements.txt
      - name: Validate and test package
        run: python -m unittest discover -s plugins/google-dev-kit/tests -v
      - name: Build portable archive
        run: python plugins/google-dev-kit/scripts/package_plugin.py "$RUNNER_TEMP/google-dev-kit-0.1.0.zip"
