---
# Claude Code — one file, four ways to run it. Comment out what you don't want.
#
#   mention   write @claude in a comment / review / issue
#   label     put the `claude` label on a PR or issue        ← one click, no typing
#   deep      Actions ▸ Run workflow, or `gh workflow run`   ← the heavy pass
#   auto      every PR, unprompted                           ← ships DISABLED
#
# Nothing here fires by itself except `auto`, which is commented out. Idle cost
# is zero — a workflow with no matching event never starts a runner.
#
# Fourth way to switch it off, no editing at all: Actions ▸ this workflow ▸ ⋯ ▸
# Disable workflow (or `gh workflow disable claude-universal.yml`). Fine for a
# pause, but it is state you can forget you left behind — commenting a job out
# is visible in the diff, disabling is not.
#
# Everything below was checked against the action's own `action.yml`, not its
# docs — the published examples still show `actions/checkout@v6` and a
# `claude-opus-4-1` model string, both long out of date.
#
# Two traps worth knowing:
#   * The Run-workflow button and `gh workflow run` only see this file once it
#     is on the DEFAULT BRANCH. On a feature branch it does not exist for them.
#   * `workflow_dispatch` carries no PR context — `github.event.pull_request` is
#     empty — which is why `deep` takes the number as an input and checks it out.
#
# Permissions are read-only on purpose. With `claude_code_oauth_token` plus the
# installed GitHub App, writes go through the App's own short-lived token. The
# upstream example asks for `contents: write` because it authenticates with a
# bare API key and has to write with GITHUB_TOKEN instead.
#
# Access control: the action itself only lets users with write access trigger
# it, and `allowed_bots` defaults to empty, so no bot can. That is the real
# gate. The `author_association` test in `mention` below is not a second
# security layer - it just stops a runner from starting at all when a
# passer-by writes @claude on a public repo, which the action would otherwise
# spin up, check out and only then refuse.
#
# Fork PRs: `pull_request` passes no secrets, so the `claude` label cannot work
# on a PR from a fork - the token would be empty. `issue_comment` runs in the
# base repo and does get secrets, so @claude is the path that works there.
# Deliberately not using `pull_request_target` to buy that back: it runs
# trusted-context code for untrusted PRs, which is a poor trade for a case that
# does not arise on a single-maintainer repo.

name: Claude Code

on: # yamllint disable-line rule:truthy
  # ── mention ───────────────────────────────────────────────────────────────
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

  # ── mention + label (issues) ──────────────────────────────────────────────
  issues:
    types: [opened, assigned, labeled]

  # ── label (pull requests) ─────────────────────────────────────────────────
  # `labeled` only. Add `opened, ready_for_review, reopened` here *and*
  # uncomment the `auto` job below to review every PR unprompted.
  pull_request:
    types: [labeled]

  # ── deep ──────────────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true
        type: string
      focus:
        description: What to concentrate on, e.g. "sandbox egress"
        required: false
        type: string
      max_turns:
        description: Turn ceiling — raise it for a genuinely hard review
        required: false
        default: '30'
        type: string

permissions: {}

jobs:
  # ════════════════════════════════════════════════════════════════════════
  # mention — replies where you tagged it. Conversational: push back in the
  # same thread instead of starting another run.
  # ════════════════════════════════════════════════════════════════════════
  mention:
    name: Claude (@mention)
    # The author test is a cost filter, not the security boundary - see the
    # header. Whichever of the three association fields the event carries has
    # to name someone who could have triggered the action anyway.
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association ||
        github.event.review.author_association ||
        github.event.issue.author_association) && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    concurrency:
      # Queue, never cancel — killing a reply mid-sentence is worse than waiting.
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number || 'none' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1, retargeted 2026-09-15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # No prompt on purpose: Claude does whatever the comment asked for.
          #
          # trigger_phrase: '@claude'
          # claude_args: '--model claude-opus-5'
          # claude_args: '--allowedTools "Bash(gh pr *)"'

  # ════════════════════════════════════════════════════════════════════════
  # label — stick the `claude` label on a PR or issue and it runs. The least
  # friction of the three, and it leaves a visible marker on what you asked for.
  # Remove the label and re-add it to run again.
  # ════════════════════════════════════════════════════════════════════════
  label:
    name: Claude (label)
    if: github.event.action == 'labeled' && github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    concurrency:
      group: claude-label-${{ github.event.issue.number || github.event.pull_request.number || 'none' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1, retargeted 2026-09-15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          label_trigger: claude
          # One comment, edited in place, however many times you re-label.
          use_sticky_comment: 'true'

  # ════════════════════════════════════════════════════════════════════════
  # deep — the heavy pass, fired by hand during an actual battle over a PR:
  #   gh workflow run claude-universal.yml -f pr=664 -f focus="sandbox egress"
  # Full history and the PR's own head, so it reads around the change instead
  # of working from the API diff alone.
  # ════════════════════════════════════════════════════════════════════════
  deep:
    name: Claude (deep review of #${{ inputs.pr }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    concurrency:
      group: claude-deep-${{ inputs.pr }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1, retargeted 2026-09-15
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # No plugin_marketplaces / plugins: `code-review` ships with Claude
          # Code itself. Installing it from a marketplace URL would pull an
          # unpinned default branch into a job holding the OAuth token, and a
          # marketplace URL takes no revision - so the fix is to not need it.
          prompt: >-
            /code-review --comment
            ${{ github.repository }}/pull/${{ inputs.pr }}
            ${{ inputs.focus && format('Concentrate on: {0}', inputs.focus) || '' }}
          # A hand-fired run leaves no trace in the thread otherwise.
          track_progress: 'true'
          claude_args: >-
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment"

  # ════════════════════════════════════════════════════════════════════════
  # auto — uncomment this job AND add the PR types to the `pull_request:`
  # trigger above. `synchronize` is deliberately not suggested: with it, a full
  # review re-runs on every push to the branch. Check how many review bots this
  # repo already runs before turning it on.
  # ════════════════════════════════════════════════════════════════════════
  # auto:
  #   name: Claude (automatic review)
  #   if: github.event_name == 'pull_request' && github.event.action != 'labeled'
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 30
  #   permissions:
  #     contents: read
  #     pull-requests: read
  #     issues: read
  #     actions: read
  #     id-token: write
  #   concurrency:
  #     group: claude-auto-${{ github.event.pull_request.number }}
  #     cancel-in-progress: true
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         fetch-depth: 1
  #     - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de # v1, retargeted 2026-09-15
  #       with:
  #         claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  #         additional_permissions: |
  #           actions: read
  #         prompt: >-
  #           /code-review --comment
  #           ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
  #         claude_args: >-
  #           --allowedTools "mcp__github_inline_comment__create_inline_comment"
