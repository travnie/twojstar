name: smx

on:
  pull_request:
    paths:
      - "smx/**"
      - ".github/workflows/smx.yml"
  push:
    branches:
      - main
    paths:
      - "smx/**"
      - ".github/workflows/smx.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ./smx
      - run: python -m unittest discover -s smx/tests -v
      - if: runner.os == 'Linux'
        run: sh -n smx/install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "smx/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
