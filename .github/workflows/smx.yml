name: smx

on: # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "spacemolt/smx/**"
      - "plugins/spacemolt/**"
      - ".github/workflows/smx.yml"
      - ".github/actions/smx-python/**"
  push:
    branches:
      - main
    paths:
      - "spacemolt/smx/**"
      - "plugins/spacemolt/**"
      - ".github/workflows/smx.yml"
      - ".github/actions/smx-python/**"
  schedule: # backend mirror + contract check; both cheap, neither touches a player
    - cron: "41 6 * * *"
  # Authenticated repository_dispatch is used by the GPTomek release operator.
  repository_dispatch:
    types: [publish_smx_pypi]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (requires matching Trusted Publisher)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
    strategy:
      matrix:
        os: [ubuntu-slim, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/smx-python
      - run: python -m unittest discover -s spacemolt/smx/tests -v
      - if: runner.os == 'Linux'
        run: sh -n spacemolt/smx/install.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "spacemolt/smx/install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  # Copies the official SpaceMolt/client-v2 linux-x64 release onto this repo's
  # `spacemolt-backend` release. Cloud Claude sessions can't reach upstream
  # releases (GitHub proxy allows only attached repos) but can reach this repo;
  # the cloud environment session-start hook downloads from here.
  backend-mirror:
    if: github.event_name != 'pull_request' && github.event_name != 'repository_dispatch'
    runs-on: ubuntu-slim
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REL: spacemolt-backend
    steps:
      - name: Mirror if upstream is newer
        run: |
          tag=$(gh release view -R SpaceMolt/client-v2 --json tagName --jq .tagName)
          have=$(gh release download "$REL" --pattern VERSION --output - 2>/dev/null || true)
          echo "upstream=$tag mirrored=${have:-none}"
          [ -n "$tag" ] && [ "$tag" != "$have" ] || exit 0
          gh release download "$tag" -R SpaceMolt/client-v2 --pattern spacemolt-client-v2-linux-x64 --output spacemolt
          chmod +x spacemolt && ./spacemolt --version
          gzip -9 spacemolt
          echo "$tag" > VERSION
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --latest=false \
            --title "SpaceMolt backend mirror" \
            --notes "Official SpaceMolt/client-v2 (MIT) linux-x64 release, mirrored for cloud agent sessions by smx.yml."
          gh release upload "$REL" spacemolt.gz VERSION --clobber

  # Compares fields smx reads with the public OpenAPI. Reads the spec only, never
  # logs in. One rolling issue tracks drift; a spec outage is a warning, not drift.
  contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    concurrency: smx-contract # a parallel run could open a second issue
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "smx: SpaceMolt contract drift"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/smx-python
      - name: Check live contract and track drift
        run: |
          rc=0
          python -m smx.contract > report.md || rc=$?
          cat report.md
          [ -s report.md ] || rc=2 # a crash prints no report; keep the issue body
          if [ "$(gh api "repos/$GH_REPO" --jq .has_issues)" != true ]; then
            # Issues disabled: no tracker; report goes to the job summary, drift still fails the job.
            cat report.md >> "$GITHUB_STEP_SUMMARY"
            [ "$rc" = 2 ] && echo "::warning::SpaceMolt OpenAPI unavailable or checker failed; contract not checked"
            [ "$rc" = 1 ] && exit 1
            exit 0
          fi
          issue=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq 'map(select(.title == env.TITLE))[0].number // empty')
          case "$rc" in
            0) [ -z "$issue" ] || gh issue close "$issue" --comment "Contract clean again." ;;
            1) if [ -n "$issue" ]; then gh issue edit "$issue" --body-file report.md
               else gh issue create --title "$TITLE" --body-file report.md; fi ;;
            *) echo "::warning::SpaceMolt OpenAPI unavailable or checker failed; contract not checked" ;;
          esac

  # Releases run only from manual dispatch or the operator's repository_dispatch.
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: python
        uses: ./.github/actions/smx-python
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Verify requested PyPI version
        if: github.event_name == 'repository_dispatch'
        env:
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          python -c 'import os, pathlib, tomllib; v=tomllib.loads(pathlib.Path("spacemolt/smx/pyproject.toml").read_text())["project"]["version"]; expected=os.environ["EXPECTED_VERSION"]; assert expected and expected == v, f"Expected {expected}, project has {v}"'
      - name: Build wheel and sdist
        run: uv build spacemolt/smx --out-dir dist
      - name: Smoke test installed wheel
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-project --with "./$wheel" -- smx --help
          uv run --no-project --with "./$wheel" -- python -m unittest discover -s spacemolt/smx/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smx-python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'repository_dispatch' && github.event.action == 'publish_smx_pypi' && toJSON(github.event.client_payload.publish) == 'true')) }}
    needs: build
    runs-on: ubuntu-slim
    environment: pypi
    permissions:
      id-token: write
    # Coalesce duplicate automated requests for one version; manual runs stay separate.
    concurrency:
      group: pypi-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || github.run_id }}
      cancel-in-progress: false
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smx-python-distributions
          path: dist
      # Rebuilds are not byte-identical, so re-publishing an existing version fails the hash check.
      - name: Skip if version already on PyPI
        id: pypi
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          version="$(basename "$wheel" | cut -d- -f2)"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/spacemolt-smx/$version/json")"
          if [ "$code" = 200 ]; then
            echo "::notice::spacemolt-smx $version already on PyPI; bump the version to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pypi.outputs.exists != 'true'
        run: uv publish --check-url https://pypi.org/simple/ dist/*
