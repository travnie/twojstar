name: smx

on:
  pull_request:
    paths:
      - "smx/**"
      - ".github/workflows/smx.yml"
  push:
    branches:
      - main
    paths:
      - "smx/**"
      - ".github/workflows/smx.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./smx
      - run: python -m unittest discover -s smx/tests -v
