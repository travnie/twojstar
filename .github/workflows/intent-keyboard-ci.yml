name: Intent keyboard CI

on:
  push:
    branches: [main]
    paths:
      - "intent-keyboard/**"
      - ".github/workflows/intent-keyboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "intent-keyboard/**"
      - ".github/workflows/intent-keyboard-ci.yml"
  workflow_dispatch:

concurrency:
  group: intent-keyboard-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select Intent Keyboard jobs
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      core_android: ${{ steps.filter.outputs.core_android }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          core_android=false
          ios=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            core_android=true
            ios=true
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            fi
            head="$HEAD_SHA"

            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")"
            fi

            while IFS= read -r changed; do
              case "$changed" in
                .github/workflows/intent-keyboard-ci.yml)
                  core_android=true
                  ios=true
                  ;;
                intent-keyboard/core/*|intent-keyboard/platforms/android/*|intent-keyboard/platforms/desktop/*)
                  core_android=true
                  ;;
                intent-keyboard/core/*|intent-keyboard/platforms/ios/*)
                  ios=true
                  ;;
                intent-keyboard/build.gradle.kts|intent-keyboard/settings.gradle.kts|intent-keyboard/gradle.properties|intent-keyboard/gradle/*|intent-keyboard/gradlew|intent-keyboard/gradlew.bat)
                  core_android=true
                  ios=true
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          echo "core_android=$core_android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  core-and-android:
    needs: changes
    if: needs.changes.outputs.core_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: intent-keyboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.0"

      - run: >-
          gradle
          :core:desktopTest
          :core:testAndroidHostTest
          :platforms:android:testDebugUnitTest
          :platforms:android:assembleDebug
          :platforms:desktop:test
          :platforms:desktop:distZip
          --stacktrace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intent-keyboard-android-debug
          path: intent-keyboard/platforms/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: intent-keyboard-desktop
          path: intent-keyboard/platforms/desktop/build/distributions/*.zip
          if-no-files-found: error

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: intent-keyboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.0"
          gradle-home-cache-includes: |
            caches
            notifications
            konan

      - name: Test and assemble shared iOS core
        run: >-
          gradle
          "-Pkonan.data.dir=$GRADLE_USER_HOME/konan"
          :core:iosSimulatorArm64Test
          :core:assembleIntentKeyboardCoreDebugXCFramework
          --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec platforms/ios/project.yml --project platforms/ios

      - name: Test keyboard preferences
        run: >-
          xcodebuild
          -project platforms/ios/IntentKeyboard.xcodeproj
          -scheme IntentKeyboardPreferencesTests
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Build host and keyboard extension
        run: >-
          xcodebuild
          -project platforms/ios/IntentKeyboard.xcodeproj
          -scheme IntentKeyboard
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build
