name: Claude Dev Kit

on:
  pull_request:
    paths:
      - "plugins/claude-dev-kit/**"
      - "plugins/_shared/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/claude-dev-kit.yml"
  push:
    branches: [main]
    paths:
      - "plugins/claude-dev-kit/**"
      - "plugins/_shared/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/claude-dev-kit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r plugins/_shared/requirements.txt
      - name: Validate portable package
        run: python plugins/openai-dev-kit/skills/chatgpt-plugin-builder/scripts/validate_plugin.py plugins/claude-dev-kit
      - name: Build portable archive
        run: python plugins/_shared/package_plugin.py plugins/claude-dev-kit "$RUNNER_TEMP/claude-dev-kit-0.1.0.zip"
      - name: Upload installable plugin ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: claude-dev-kit-plugin
          path: ${{ runner.temp }}/claude-dev-kit-0.1.0.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 30
