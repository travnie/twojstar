---
# Mirrors the latest official SpaceMolt/client-v2 linux-x64 release binary onto
# release `spacemolt-backend` (copy, no build). Cloud Claude sessions can't reach that repo's
# releases (GitHub proxy allows only attached repos), but can reach this one;
# .claude/hooks/session-start.sh downloads from here.

name: SpaceMolt backend mirror

on: # yamllint disable-line rule:truthy
  schedule: # cheap tag check; copies only when upstream has a new release
    - cron: "41 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/spacemolt-backend.yml]

permissions:
  contents: write

concurrency:
  group: spacemolt-backend

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  REL: spacemolt-backend

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check versions
        id: v
        run: |
          tag=$(gh release view -R SpaceMolt/client-v2 --json tagName --jq .tagName)
          have=$(gh release download "$REL" --pattern VERSION --output - 2>/dev/null || true)
          echo "upstream=$tag mirrored=${have:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ -n "$tag" ] && [ "$tag" != "$have" ] && echo "copy=1" >> "$GITHUB_OUTPUT" || true

      - name: Copy and publish
        if: steps.v.outputs.copy
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release download "$TAG" -R SpaceMolt/client-v2 --pattern spacemolt-client-v2-linux-x64 --output spacemolt
          chmod +x spacemolt && ./spacemolt --version
          gzip -9 spacemolt
          echo "$TAG" > VERSION
          gh release view "$REL" >/dev/null 2>&1 || gh release create "$REL" --latest=false \
            --title "SpaceMolt backend mirror" \
            --notes "Official SpaceMolt/client-v2 (MIT) linux-x64 release, mirrored for cloud agent sessions by spacemolt-backend.yml."
          gh release upload "$REL" spacemolt.gz VERSION --clobber
