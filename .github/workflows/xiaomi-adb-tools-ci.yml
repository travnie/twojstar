name: Xiaomi ADB Tools CI

on:
  push:
    branches: [main]
    paths:
      - "xiaomi-adb-tools/**"
      - "!xiaomi-adb-tools/**/*.md"
      - ".github/workflows/xiaomi-adb-tools-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "xiaomi-adb-tools/**"
      - "!xiaomi-adb-tools/**/*.md"
      - ".github/workflows/xiaomi-adb-tools-ci.yml"
  workflow_dispatch:

concurrency:
  group: xiaomi-adb-tools-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: xiaomi-adb-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - run: ./gradlew platformJars

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: XiaomiADBFastbootTools
          path: |
            xiaomi-adb-tools/build/libs/XiaomiADBFastbootTools-*.jar
            xiaomi-adb-tools/build/libs/XiaomiADBFastbootTools-ASSETS.txt
          if-no-files-found: error
          retention-days: 7
