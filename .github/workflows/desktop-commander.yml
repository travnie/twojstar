name: Desktop Commander Plugin

on:
  pull_request:
    paths:
      - "plugins/desktop-commander/**"
      - "plugins/_shared/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/desktop-commander.yml"
  push:
    branches: [main]
    paths:
      - "plugins/desktop-commander/**"
      - "plugins/_shared/**"
      - ".agents/plugins/marketplace.json"
      - ".github/workflows/desktop-commander.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r plugins/_shared/requirements.txt
      - name: Build and validate portable archive
        run: python plugins/_shared/package_plugin.py plugins/desktop-commander "$RUNNER_TEMP/desktop-commander-0.1.0.zip"
