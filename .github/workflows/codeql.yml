name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select CodeQL languages
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      languages: ${{ steps.filter.outputs.languages }}
      has_no_build: ${{ steps.filter.outputs.has_no_build }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Match changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          actions=false
          cpp=false
          csharp=false
          javascript=false
          swift=false

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            actions=true
            cpp=true
            csharp=true
            javascript=true
            swift=true
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            fi
            head="$HEAD_SHA"

            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-parse "$head^" 2>/dev/null || printf '%s' "$head")"
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/*|.github/actions/*|action.yml|action.yaml)
                  actions=true
                  ;;
              esac

              case "$file" in
                *.c|*.cc|*.cpp|*.cxx|*.h|*.hh|*.hpp|*.hxx|CMakeLists.txt|*.cmake)
                  cpp=true
                  ;;
              esac

              case "$file" in
                *.cs|*.csproj|*.sln|*.slnx|*.props|*.targets|global.json)
                  csharp=true
                  ;;
              esac

              case "$file" in
                *.js|*.mjs|*.cjs|*.jsx|*.ts|*.tsx|*/package.json|*/package-lock.json|*/pnpm-lock.yaml|*/yarn.lock|*/tsconfig*.json)
                  javascript=true
                  ;;
              esac

              case "$file" in
                intent-keyboard/core/*|intent-keyboard/core/**|intent-keyboard/platforms/ios/*|intent-keyboard/platforms/ios/**|intent-keyboard/build.gradle.kts|intent-keyboard/settings.gradle.kts|intent-keyboard/gradle.properties|intent-keyboard/gradle/*|intent-keyboard/gradle/**|intent-keyboard/gradlew|intent-keyboard/gradlew.bat)
                  swift=true
                  ;;
              esac
            done < <(git diff --name-only "$base" "$head")
          fi

          languages=()
          "$actions" && languages+=('"actions"')
          "$cpp" && languages+=('"c-cpp"')
          "$csharp" && languages+=('"csharp"')
          "$javascript" && languages+=('"javascript-typescript"')

          joined="$(IFS=,; printf '%s' "${languages[*]-}")"
          if (( ${#languages[@]} > 0 )); then
            has_no_build=true
          else
            has_no_build=false
          fi

          echo "languages=[$joined]" >> "$GITHUB_OUTPUT"
          echo "has_no_build=$has_no_build" >> "$GITHUB_OUTPUT"
          echo "swift=$swift" >> "$GITHUB_OUTPUT"

  no-build:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.has_no_build == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.languages) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"

  # Kotlin 2.4.20 is temporarily omitted: stable CodeQL 2.27.0 cannot trace it,
  # while build-mode none does not analyze Kotlin. Restore it with 2.27.1+.
  swift:
    name: Analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    defaults:
      run:
        working-directory: intent-keyboard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.0"
          gradle-home-cache-includes: |
            caches
            notifications
            konan

      - name: Assemble shared iOS core
        run: >-
          gradle
          "-Pkonan.data.dir=$GRADLE_USER_HOME/konan"
          :core:assembleIntentKeyboardCoreDebugXCFramework
          --stacktrace

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec platforms/ios/project.yml --project platforms/ios

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: swift
          build-mode: manual

      - name: Build host and keyboard extension
        run: >-
          xcodebuild
          -project platforms/ios/IntentKeyboard.xcodeproj
          -scheme IntentKeyboard
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:swift"