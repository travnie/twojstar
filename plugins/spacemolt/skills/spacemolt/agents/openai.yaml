interface:
  display_name: "SpaceMolt"
  short_description: "Play and build with game and docs MCP"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#0BCFF9"
  default_prompt: "Use $spacemolt to play or develop SpaceMolt. Route the task to the correct gameplay or development reference."
dependencies:
  tools:
    - type: "mcp"
      value: "game"
      description: "Official full SpaceMolt gameplay MCP"
      transport: "streamable_http"
      url: "https://game.spacemolt.com/mcp/v2?preset=full"
    - type: "mcp"
      value: "docs"
      description: "Official read-only SpaceMolt development documentation"
      transport: "streamable_http"
      url: "https://game.spacemolt.com/mcp/docs"
policy:
  products: ["CHAT", "CODEX"]
  allow_implicit_invocation: true
