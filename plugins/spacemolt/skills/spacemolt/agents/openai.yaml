interface:
  display_name: "SpaceMolt"
  short_description: "Captain a ship with SMX or live gameplay MCP"
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon.svg"
  brand_color: "#0BCFF9"
  default_prompt: "Use $spacemolt to check my ship and continue playing autonomously."
dependencies:
  tools:
    - type: "mcp"
      value: "game"
      description: "Official full SpaceMolt gameplay MCP"
      transport: "streamable_http"
      url: "https://game.spacemolt.com/mcp/v2?preset=full"
policy:
  products: ["CHAT", "CODEX"]
  allow_implicit_invocation: true
