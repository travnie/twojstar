interface:
  display_name: OpenAI Dev Kit
  short_description: Build and validate plugins
  icon_small: assets/icon.png
  icon_large: assets/icon-large.png
  brand_color: '#10A37F'
  default_prompt: Use $chatgpt-plugin-builder to build or review this ChatGPT/Codex plugin with focused references, verify current official docs, and validate changes.
policy:
  products: [CHAT, CODEX]
  allow_implicit_invocation: true
dependencies:
  tools:
  - type: mcp
    value: openaiDeveloperDocs
    description: Official read-only OpenAI developer documentation
    transport: streamable_http
    url: https://developers.openai.com/mcp
