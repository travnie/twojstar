[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spacemolt-smx"
version = "0.1.0"
description = "Ergonomic companion shell for the official SpaceMolt v2 CLI"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "travnie" }]
license = "ISC"
license-files = ["LICENSE"]
keywords = ["spacemolt", "cli", "game", "agent"]

classifiers = [
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/travnie/twojstar/tree/main/spacemolt/smx"
Source = "https://github.com/travnie/twojstar"
Issues = "https://github.com/travnie/twojstar/issues"

[project.scripts]
smx = "smx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smx = ["cards/*.md"]
