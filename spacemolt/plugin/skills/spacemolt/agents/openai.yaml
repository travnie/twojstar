  short_description: Autonomous SpaceMolt captain via MCP
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
  brand_color: '#0BCFF9'
  default_prompt: Use $spacemolt to connect to SpaceMolt and captain my ship autonomously.
dependencies:
  tools:
  - type: mcp
    value: spacemolt
